[project]
name = "archive-governor"
version = "3.1.0"
description = "会话冷归档治理工具 — 阈值触发 + 内容级整合,零 token / 零 LLM / 零视图"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
govern = "scripts.session_governor:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]